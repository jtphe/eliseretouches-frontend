<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galerie Photos – Elise Retouches Strasbourg</title>
    <meta
      name="description"
      content="Découvrez en images l'atelier Elise Retouches à Strasbourg : devanture, matériel de couture et savoir-faire au quotidien."
    />
    <link rel="canonical" href="https://eliseretouches.com/gallery.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elise Retouches" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Galerie Photos – Elise Retouches Strasbourg" />
    <meta
      property="og:description"
      content="L'atelier Elise Retouches en images : devanture, matériel de couture et savoir-faire au quotidien."
    />
    <meta property="og:url" content="https://eliseretouches.com/gallery.html" />
    <meta property="og:image" content="https://eliseretouches.com/media/logo_erh.jpeg" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.2/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header></header>

    <main class="main-content">
      <section class="container py-5">
        <h1 class="text-center reveal">Galerie</h1>
        <div class="row">
          <div class="gallery-grid">
            <div
              class="gallery-item reveal"
              data-toggle="modal"
              data-target="#imageModal"
              data-src="./media/photos/gallery/1.jpeg"
            >
              <img
                src="./media/photos/gallery/1.jpeg"
                alt="Enseigne Elise Retouches"
                loading="lazy"
              />
            </div>
            <div
              class="gallery-item reveal"
              data-toggle="modal"
              data-target="#imageModal"
              data-src="./media/photos/gallery/2.jpeg"
            >
              <img
                src="./media/photos/gallery/2.jpeg"
                alt="Devanture Elise Retouches"
                loading="lazy"
              />
            </div>
            <div
              class="gallery-item reveal"
              data-toggle="modal"
              data-target="#imageModal"
              data-src="./media/photos/gallery/3.jpeg"
            >
              <img
                src="./media/photos/gallery/3.jpeg"
                alt="Dressing habits clients ER"
                loading="lazy"
              />
            </div>
            <div
              class="gallery-item reveal"
              data-toggle="modal"
              data-target="#imageModal"
              data-src="./media/photos/gallery/8.jpeg"
            >
              <img
                src="./media/photos/gallery/8.jpeg"
                alt="Bobines machine ER"
                loading="lazy"
              />
            </div>
            <div
              class="gallery-item reveal"
              data-toggle="modal"
              data-target="#imageModal"
              data-src="./media/photos/gallery/9.jpeg"
            >
              <img
                src="./media/photos/gallery/9.jpeg"
                alt="Pantalon gris retouches ER"
                loading="lazy"
              />
            </div>
            <div
              class="gallery-item reveal"
              data-toggle="modal"
              data-target="#imageModal"
              data-src="./media/photos/gallery/4.jpeg"
            >
              <img
                src="./media/photos/gallery/4.jpeg"
                alt="Rangement bobines ER"
                loading="lazy"
              />
            </div>
            <div
              class="gallery-item reveal"
              data-toggle="modal"
              data-target="#imageModal"
              data-src="./media/photos/gallery/7.jpeg"
            >
              <img
                src="./media/photos/gallery/7.jpeg"
                alt="Elise en train de travailler une robe"
                loading="lazy"
              />
            </div>
            <div
              class="gallery-item reveal"
              data-toggle="modal"
              data-target="#imageModal"
              data-src="./media/photos/gallery/6.jpeg"
            >
              <img
                src="./media/photos/gallery/6.jpeg"
                alt="Elise avec une cliente"
                loading="lazy"
              />
            </div>
            <div
              class="gallery-item reveal"
              data-toggle="modal"
              data-target="#imageModal"
              data-src="./media/photos/gallery/5.jpeg"
            >
              <img
                src="./media/photos/gallery/5.jpeg"
                alt="Elise analyse un pantalon pour enfant"
                loading="lazy"
              />
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Modal pour la prévisualisation d'image -->
    <div
      class="modal fade"
      id="imageModal"
      tabindex="-1"
      role="dialog"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
          <div class="modal-body">
            <div class="modal-body position-relative">
              <button class="arrow-btn left" id="prevBtn">&#8249;</button>
              <img
                id="modalImage"
                src=""
                alt="Image Preview"
                class="img-fluid"
              />
              <button class="arrow-btn right" id="nextBtn">&#8250;</button>
            </div>
          </div>
          <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
      </div>
    </div>
    <footer></footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
